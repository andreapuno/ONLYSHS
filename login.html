<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ONLYSHS System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <div class="brand-row">
            <a class="brand" href="index.html">ONLYSHS SYSTEM</a>
            <a class="button" href="login.html">Login</a>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="activities.html">Activities</a>
            <a href="assignments.html">Assignments</a>
            <a href="projects.html">Projects</a>
        </nav>
    </div>
</header>

<main class="container login-layout">
    <section class="login-card">
        <h1>LOGIN</h1>

        <p>
            Sign in to access your student dashboard.
        </p>

        <form action="#" method="get">
            <div class="form-group">
                <label for="username">USERNAME</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="button">
                LOGIN
            </button>

            <p class="form-note">
                For authorized students and users only.
            </p>
        </form>
    </section>
</main>

<footer>
    <p>ONLYSHS Technology System</p>
</footer>

</body>
</html>
